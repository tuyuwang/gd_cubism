name: Build GDExtension

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        sparse-checkout: |
          .github
          demo
          src
          SConstruct
          thirdparty/CubismSdkForNative-5-r.1/Core
          thirdparty/CubismSdkForNative-5-r.1/Framework
          thirdparty/CubismSdkForNative-5-r.1/*.md
          godot-cpp

    - name: Enable Git long paths
      run: git config --global core.longpaths true

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install SCons
      run: pip install scons

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Build GDExtension (Windows x64)
      run: |
        scons platform=windows target=template_release arch=x86_64
      working-directory: ${{ github.workspace }}

    - name: Build GDExtension (Windows x86)
      run: |
        scons platform=windows target=template_release arch=x86
      working-directory: ${{ github.workspace }}

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-release
        path: |
          demo/addons/gd_cubism/bin/**/*.dll
          demo/addons/gd_cubism/bin/**/*.lib
        retention-days: 30

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Enable Git long paths
      run: git config --global core.longpaths true

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install SCons
      run: pip install scons

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libx11-dev libxcursor-dev libxext-dev libxrandr-dev libxinerama-dev libxi-dev libgl-dev libglu1-mesa-dev

    - name: Build GDExtension (Linux x64)
      run: |
        scons platform=linux target=template_release arch=x86_64
      working-directory: ${{ github.workspace }}

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-release
        path: |
          demo/addons/gd_cubism/bin/**/*.so
        retention-days: 30

  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Enable Git long paths
      run: git config --global core.longpaths true

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install SCons
      run: pip install scons

    - name: Build GDExtension (macOS x64)
      run: |
        scons platform=macos target=template_release arch=x86_64
      working-directory: ${{ github.workspace }}

    - name: Build GDExtension (macOS arm64)
      run: |
        scons platform=macos target=template_release arch=arm64
      working-directory: ${{ github.workspace }}

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-release
        path: |
          demo/addons/gd_cubism/bin/**/*.dylib
          demo/addons/gd_cubism/bin/**/*.framework
        retention-days: 30