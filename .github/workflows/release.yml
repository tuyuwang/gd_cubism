name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install SCons
      run: pip install scons

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libx11-dev libxcursor-dev libxext-dev libxrandr-dev libxinerama-dev libxi-dev libgl-dev libglu1-mesa-dev

    - name: Build Linux x64
      run: |
        scons platform=linuxbsd target=template_release arch=x86_64
      working-directory: ${{ github.workspace }}

    - name: Create Release Archive
      run: |
        cd demo/addons/gd_cubism/bin
        tar -czf linux-x64-release.tar.gz *template_release*
        cd -

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: demo/addons/gd_cubism/bin/linux-x64-release.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}